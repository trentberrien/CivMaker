name: CivMaker
version: '0.15.1'
main: dev.civmaker.CivMaker
api-version: '26.3'
load: STARTUP
description: Village claims, mining payouts, and scheduled vault raids
commands:
  civ:
    description: Manage your CivMaker wallet or village
    usage: /civ help
  trade:
    description: Trade items with another player
    usage: /trade <player|test|--recover>
  wilderness:
    description: Teleport to a random safe location inside the world border
    usage: /wilderness
permissions:
  civmaker.trade.test:
    description: Open a test trade that offers 10 dirt
    default: op
  civmaker.admin:
    description: Adjust wallets, manage raid windows, and disband villages
    default: op
  civmaker.admin.manage:
    description: Grant or revoke the CivMaker admin role
    default: op
